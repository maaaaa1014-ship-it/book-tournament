<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今年の1冊トーナメント</title>
<meta name="description" content="毎月読んだ本からその月のベストを選び、トーナメントで今年の1冊を決める読書ブラケット。表紙検索つき、結果は画像でXにシェアできます。">
<meta property="og:title" content="今年の1冊トーナメント">
<meta property="og:description" content="月ごとのベスト本をトーナメントで戦わせて、今年の1冊を決めよう。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f4f5f8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' rx='2' fill='%232f43c8'/%3E%3Crect x='6' y='4' width='4' height='24' fill='%231b2130' opacity='.35'/%3E%3Cpath d='M13 12h9M13 16h7' stroke='%23ffe04a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the paper bracket template, redrawn on a fixed-ratio stage (1000 x 1840 units) with tap-to-fill slots */
:root{
  --paper:#f4f5f8; --card:#ffffff; --ink:#1b2130; --muted:#646d82; --line:#8f98ab;
  --accent:#2f43c8; --accent-ink:#ffffff; --mark:#ffe04a; --mark-ink:#1b2130;
  --slot:#ffffff; --slot-edge:#1b2130; --danger:#c23b3b;
  --f-display:"Bricolage Grotesque","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#13161e; --card:#1c202b; --ink:#e8ebf2; --muted:#9aa2b5; --line:#5d667b;
    --accent:#8d9dff; --accent-ink:#0f1320; --mark:#e9c936; --mark-ink:#1b2130;
    --slot:#1c202b; --slot-edge:#cdd3df; --danger:#ff8a8a; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.brand{margin:0;font:700 17px/1.3 var(--f-body)}
.prog{margin:2px 0 0;font-size:13px;color:var(--muted)}
.prog b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.yearsel{font:500 14px var(--f-mono);background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 10px}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:1000/1840;container-type:inline-size}
.stage svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lines .dot{stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-dasharray:0.1 9;fill:none}
.lines .scallop{stroke:var(--slot-edge);stroke-width:3;fill:var(--slot)}
.mlabel{position:absolute;display:flex;align-items:center;justify-content:center;font:500 max(9px,3.1cqw)/1 var(--f-mono);letter-spacing:.04em}
.ttl{position:absolute;font:500 6.6cqw/1.08 var(--f-display);letter-spacing:-.01em;margin:0}
.ttl .sub{display:block;margin-top:2.2cqw;font:500 max(10px,2.6cqw)/1.4 var(--f-body);color:var(--muted);letter-spacing:.06em}
.ttl .champwrap{display:block;margin-top:2cqw;max-width:100%}
.ttl .champ{font:700 max(11px,3cqw)/1.5 var(--f-body);background:linear-gradient(transparent 55%,var(--mark) 55%);color:var(--ink);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blabel{position:absolute;display:flex;align-items:flex-end;justify-content:center;font:500 4.3cqw/1 var(--f-display)}
.blabel.below{align-items:flex-start}

.slot{position:absolute;container-type:inline-size;border:2px solid var(--slot-edge);background:var(--slot);padding:0;overflow:hidden;cursor:pointer;border-radius:2px;transition:transform .15s ease}
.slot:disabled,.slot.bye{cursor:default}
.slot.idle{border-color:color-mix(in srgb,var(--slot-edge) 45%,transparent)}
.slot.ready{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);animation:breathe 2.2s ease-in-out infinite}
.slot:not(:disabled):not(.bye):active{transform:scale(.96)}
.slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font:700 max(9px,13cqw)/1.25 var(--f-body);color:var(--muted)}
.slot.ready .ph{color:var(--accent)}
.slot .ph.plus{font:400 34cqw/1 var(--f-display);color:var(--line)}
.slot img,.th img,.pc img,.prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.slot.best{border:none;background:transparent;overflow:visible}
.slot.best .inner{position:absolute;inset:6%;overflow:hidden;container-type:inline-size}
.slot.best .ph{font:500 9cqw/1.4 var(--f-display)}
.badge{position:absolute;right:3px;top:3px;z-index:2;background:var(--ink);color:var(--paper);font:500 max(8px,11cqw)/1 var(--f-mono);padding:3px 4px;border-radius:2px}
.stamp{position:absolute;z-index:3;right:-6%;bottom:-4%;transform:rotate(9deg);background:var(--mark);color:var(--mark-ink);font:700 10cqw/1 var(--f-display);padding:3% 6%;letter-spacing:.04em;box-shadow:0 2px 0 var(--slot-edge)}
.just{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.just .stamp{animation:stamp .6s .15s cubic-bezier(.2,1.6,.4,1) both}
@keyframes breathe{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 12%,transparent)}}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:rotate(30deg) scale(2.4);opacity:0}100%{transform:rotate(9deg) scale(1);opacity:1}}

/* generated cover */
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:9cqw 8cqw 9cqw 12cqw;background:var(--g);color:#fff;text-align:left}
.gen::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5cqw;background:rgb(0 0 0/.18)}
.gen b{position:relative;font:700 max(7px,14cqw)/1.22 var(--f-body);overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gen i{position:relative;font:400 max(6px,9.5cqw)/1.2 var(--f-body);font-style:normal;opacity:.85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.sharebar{display:flex;flex-direction:column;gap:6px}
.sharebar .primary{min-height:48px;font-size:15px}

/* how-to */
.how{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.how h3{margin:0;font:700 15px/1.4 var(--f-body)}
.how ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.7;max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fine{margin:0;font-size:12px;line-height:1.7;color:var(--muted)}

.ghost,.primary,.danger{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink)}
.ghost{background:transparent;border:1px solid var(--line)}
.primary{background:var(--accent);color:var(--accent-ink);border:none;font-weight:700}
.danger{background:var(--danger);color:var(--paper);border:none}
.primary:disabled{opacity:.5;cursor:default}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgb(8 10 18/.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding-top:18px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:rise .25s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-head h2{margin:2px 0 0;font:700 20px/1.35 var(--f-body);text-wrap:balance}
.sh-head{position:sticky;top:-18px;z-index:2;background:var(--card);margin-top:-18px;padding-top:18px;padding-bottom:6px}
.donebar{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:2;background:var(--card);margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px));padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.done{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;border:none;background:var(--ink);color:var(--paper);font-size:15px;font-weight:700;cursor:pointer}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.hint,.note{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.empty{margin:0;padding:14px;border:1px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted);text-align:center}
.books{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.books li{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}
.books li.is-best{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer}
.bk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.th,.pc,.prev{position:relative;container-type:inline-size;aspect-ratio:2/3;overflow:hidden;border-radius:3px;background:color-mix(in srgb,var(--line) 25%,transparent)}
.bk .th{width:42px;flex:none}
.meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.meta i{font-style:normal;font-size:12px;color:var(--muted)}
.meta em{font-style:normal;align-self:flex-start;font:700 11px/1.6 var(--f-body);padding:0 6px;background:var(--mark);color:var(--mark-ink);border-radius:2px}
.del{flex:none;min-height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12px;color:var(--muted)}
.del.arm{border-color:var(--danger);color:var(--danger);font-weight:700}

.add{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.add h3{margin:0;font:700 15px/1.4 var(--f-body)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
input[type=text],input[type=search]{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.add-grid{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.prev{width:76px}
.prev .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;padding:4px}
.fields{min-width:0;display:flex;flex-direction:column;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:18px}
.rgroup{display:flex;flex-direction:column;gap:8px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.rhead b{font:700 14px/1.4 var(--f-body);overflow-wrap:anywhere}
.rhead i{font-style:normal;font-size:12px;color:var(--muted)}
.rhead small{font:500 11px/1 var(--f-mono);color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.rc{position:relative;container-type:inline-size;aspect-ratio:2/3;padding:0;border:none;border-radius:3px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--line) 25%,transparent)}
.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.rc .tag{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgb(0 0 0/.55);color:#fff;font-size:10px;text-align:center;padding:2px 0}
.rc:active{transform:scale(.96)}
.rmore{font-size:12px;color:var(--muted)}
.results:empty{display:none}
.results>p{grid-column:1/-1}
.res{display:flex;flex-direction:column;gap:4px;padding:0;border:none;background:transparent;text-align:left;cursor:pointer;min-width:0}
.res b{font-size:12px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.covers{display:flex;flex-direction:column;gap:8px}
.covers h4{margin:0;font:700 13px/1.4 var(--f-body)}
.cstrip{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.ctile{flex:none;width:64px;position:relative;container-type:inline-size;aspect-ratio:2/3;padding:0;border:2px solid transparent;border-radius:4px;background:color-mix(in srgb,var(--line) 25%,transparent);overflow:hidden;cursor:pointer;scroll-snap-align:start}
.ctile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.ctile.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.ctile .tag{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgb(0 0 0/.55);color:#fff;font-size:10px;text-align:center;padding:2px 0}
.ctile.more{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cover-btn{flex:none;min-height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12px;color:var(--muted)}
.books li .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vsmark{font:700 15px/1 var(--f-display);color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:6px;padding:8px;border:2px solid var(--line);border-radius:12px;background:transparent;cursor:pointer;text-align:left;min-width:0}
.pick:hover{border-color:var(--accent)}
.pick.won{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick .pt{font:700 14px/1.4 var(--f-body);overflow-wrap:anywhere}
.pick .pa{font:500 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em}

.shot{display:flex;justify-content:center;background:color-mix(in srgb,var(--line) 18%,transparent);border-radius:10px;padding:10px;min-height:120px;align-items:center}
.shot img{max-height:56vh;width:auto;border-radius:4px;box-shadow:0 2px 12px rgb(0 0 0/.15)}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:13px;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function(){
'use strict';
var TOTAL=1840, BW=130, BH=195;
var COLX=[83.33,250,416.67,583.33,750,916.67];
var EN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var NOW_Y=new Date().getFullYear();
var HASHTAG='#今年の1冊トーナメント';

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'b'+Math.random().toString(36).slice(2,10)}
function blank(y){return {v:1,year:y,updatedAt:0,months:Array.from({length:12},function(){return {books:[],best:null}}),picks:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function siteURL(){return location.origin+location.pathname.replace(/index\.html$/,'')}

var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

/* ---------- state ---------- */
function key(y){return 'fbty-'+y}
function loadYear(y){var s=null;try{s=JSON.parse(lsGet(key(y)))}catch(e){}return (s&&s.months)?s:blank(y)}
var year=+(lsGet('fbty-year')||NOW_Y)||NOW_Y;
var state=loadYear(year);
function save(){
  state.updatedAt=Date.now();
  if(!lsSet(key(year),JSON.stringify(state))) toast('保存できませんでした。端末の空き容量やブラウザ設定を確認してください。');
  lsSet('fbty-year',String(year));
}
function storedYears(){var ys={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),m=/^fbty-(\d{4})$/.exec(k);if(m)ys[m[1]]=1}}catch(e){}return Object.keys(ys).map(Number)}

function bookById(id){for(var m=0;m<12;m++){var b=state.months[m].books;for(var i=0;i<b.length;i++)if(b[i].id===id)return {book:b[i],month:m}}return null}
function monthChamp(m){var mo=state.months[m];if(!mo.books.length)return null;if(mo.best&&mo.books.some(function(b){return b.id===mo.best}))return mo.best;if(mo.books.length===1)return mo.books[0].id;return null}
var NODES={};
[0,1].forEach(function(h){var b=h*6,p='h'+h;
  NODES[p+'a']=[{m:b},{m:b+1}];NODES[p+'b']=[{m:b+2},{m:b+3}];NODES[p+'c']=[{m:b+4},{m:b+5}];
  NODES[p+'d']=[{n:p+'a'},{n:p+'b'}];NODES[p+'e']=[{n:p+'d'},{n:p+'c'}];});
NODES.final=[{n:'h0e'},{n:'h1e'}];
var ORDER=['h0a','h0b','h0c','h0d','h0e','h1a','h1b','h1c','h1d','h1e','final'];
function src(s){return s.m!==undefined?monthChamp(s.m):winner(s.n)}
function parts(n){return NODES[n].map(src)}
function winner(n){var p=parts(n),w=state.picks[n];return (p[0]&&p[1]&&(w===p[0]||w===p[1]))?w:null}
function cleanup(){ORDER.forEach(function(n){var w=state.picks[n];if(w==null)return;var p=parts(n);if(!(p[0]&&p[1]&&(w===p[0]||w===p[1])))delete state.picks[n]})}
function commit(){cleanup();save();render()}

/* ---------- geometry (shared by the page and the share image) ---------- */
var LINES=(function(){
  var top=[[148.3,147.5,185,147.5],[166.67,147.5,166.67,290],[481.7,147.5,518.3,147.5],[500,147.5,500,290],[815,147.5,851.7,147.5],[833.33,147.5,833.33,290],
    [231.7,387.5,435,387.5],[333.33,387.5,333.33,430],[666.67,387.5,768.3,387.5],[666.67,387.5,666.67,430],[398.3,527.5,601.7,527.5],[500,527.5,500,670]];
  var all=top.concat(top.map(function(l){return [l[0],TOTAL-l[1],l[2],TOTAL-l[3]]}));
  all.push([500,865,500,975],[500,920,650,920]);return all;
})();
var BEST={x:650,y:695,w:300,h:450};
function scallopD(x,y,w,h){
  var r=12.5,d='M'+x+' '+y,i;

function blobToCover(blob){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(blob),img=new Image();
    img.onload=function(){
      if(img.width<20||img.height<20){URL.revokeObjectURL(url);return rej()}
      var tw=240,th=360,c=document.createElement('canvas');c.width=tw;c.height=th;
      var ctx=c.getContext('2d'),s=Math.max(tw/img.width,th/img.height),w=img.width*s,h=img.height*s;
      ctx.fillStyle='#fff';ctx.fillRect(0,0,tw,th);ctx.drawImage(img,(tw-w)/2,(th-h)/2,w,h);URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}
function proxied(u){return 'https://wsrv.nl/?url='+encodeURIComponent(u)+'&output=jpg'}
function urlToCover(url){
  var tries=[url,proxied(url)],i=0;
  function next(){
    if(i>=tries.length)return Promise.resolve(url);
    var u=tries[i++];
    return fetch(u,{mode:'cors'}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){if(!/^image\//.test(b.type))throw 0;return blobToCover(b)}).catch(next);
  }
  return next();
}

var lastResults=[];
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function ndlThumb(isbn){return /^97[89]4/.test(isbn)?'https://ndlsearch.ndl.go.jp/thumbnail/'+isbn+'.jpg':''}
function fromGoogle(q){
  return withTimeout(fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20&printType=books'),8000)
    .then(function(r){if(!r.ok)throw new Error('google '+r.status);return r.json()})
    .then(function(j){
      return (j.items||[]).map(function(it){
        var v=it.volumeInfo||{},il=v.imageLinks||{},isbn='';
        (v.industryIdentifiers||[]).forEach(function(x){if(x.type==='ISBN_13')isbn=x.identifier});
        var cover=(il.thumbnail||il.smallThumbnail||'').replace(/^http:/,'https:').replace('&edge=curl','')||ndlThumb(isbn);
        return {title:(v.title||'')+(v.subtitle?' '+v.subtitle:''),author:(v.authors||[]).join(', '),cover:cover,isbn:isbn,pub:v.publisher||''};
      });
    });
}
function fromOpenLibrary(q){
  return withTimeout(fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=20&fields=title,author_name,cover_i,isbn'),8000)
    .then(function(r){if(!r.ok)throw new Error('ol '+r.status);return r.json()})
    .then(function(j){
      return (j.docs||[]).map(function(d){
        var isbn=(d.isbn||[]).filter(function(x){return x.length===13})[0]||'';
        return {title:d.title||'',author:(d.author_name||[]).slice(0,2).join(', '),cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':ndlThumb(isbn),isbn:isbn};
      });
    });
}
function fromNDL(q){
  return withTimeout(fetch('https://ndlsearch.ndl.go.jp/api/opensearch?any='+encodeURIComponent(q)+'&mediatype=1&cnt=20'),8000)
    .then(function(r){if(!r.ok)throw new Error('ndl '+r.status);return r.text()})
    .then(function(t){
      var doc=new DOMParser().parseFromString(t,'application/xml');
      return Array.prototype.map.call(doc.getElementsByTagName('item'),function(it){
        var title=(it.getElementsByTagName('title')[0]||{}).textContent||'',author='',isbn='';
        var cr=it.getElementsByTagNameNS('*','creator')[0];if(cr)author=cr.textContent.replace(/\s*著$/,'');
        Array.prototype.forEach.call(it.getElementsByTagNameNS('*','identifier'),function(el){var v=el.textContent.replace(/-/g,'');if(/^97[89]\d{10}$/.test(v))isbn=v});
        var pb=it.getElementsByTagNameNS('*','publisher')[0];return {title:title,author:author,cover:ndlThumb(isbn),isbn:isbn,pub:pb?pb.textContent:''};
      });
    });
}
function searchBooks(q){
  var jp=/[぀-ヿ㐀-鿿]/.test(q);
  var sources=jp?[fromGoogle(q),fromNDL(q),fromOpenLibrary(q)]:[fromGoogle(q),fromOpenLibrary(q),fromNDL(q)];
  return Promise.all(sources.map(function(p){return p.then(function(v){return {ok:true,v:v}},function(e){return {ok:false,e:e}})}))
    .then(function(rs){
      if(!rs.some(function(r){return r.ok}))throw rs.map(function(r){return r.e&&r.e.message}).join(', ');
      var seen={},out=[];
      rs.forEach(function(r){if(r.ok)r.v.forEach(function(b){if(!b.title)return;var k=normT(b.title.split(/[:：]/)[0])+'|'+normA(b.author);
        var g=seen[k];if(!g){g=seen[k]={title:b.title,author:b.author,covers:[],_u:{}};out.push(g)}
        if(b.cover&&!g._u[b.cover]){g._u[b.cover]=1;g.covers.push({u:b.cover,pub:b.pub||''})}})});
      out.sort(function(a,b){return (b.covers.length?1:0)-(a.covers.length?1:0)});
      return out.slice(0,10);
    });
}
function normT(t){return String(t||'').toLowerCase().replace(/[\s:：・\-‐–—'’"“”!！?？.,、。()（）\[\]【】]/g,'')}
function normA(a){return String(a||'').toLowerCase().split(/[,，、]/)[0].replace(/[\s.・]/g,'')}
function uniq(a){var s={};return a.filter(function(x){if(!x||s[x])return false;s[x]=1;return true})}
function gThumb(v){var il=v.imageLinks||{};return (il.thumbnail||il.smallThumbnail||'').replace(/^http:/,'https:').replace('&edge=curl','')}
function moreCovers(title,author,kw){
  var base=String(title).split(/[:：]/)[0].trim(),au=String(author||'').split(/[,，、]/)[0].trim(),nt=normT(base);
  var latin=!/[぀-ヿ㐀-鿿]/.test(base),pref=String(kw||(latin?'penguin':'')).toLowerCase();
  function sameTitle(t){var n=normT(t);return !!n&&(n.indexOf(nt)===0||nt.indexOf(n)===0)}
  function gq(q){
    return withTimeout(fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40'),8000)
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){var out=[];(j.items||[]).forEach(function(it){var v=it.volumeInfo||{},isbn='';
        if(!sameTitle(v.title))return;
        (v.industryIdentifiers||[]).forEach(function(x){if(x.type==='ISBN_13')isbn=x.identifier});
        var c=gThumb(v);if(c)out.push({u:c,pub:v.publisher||''});if(ndlThumb(isbn))out.push({u:ndlThumb(isbn),pub:v.publisher||''})});return out})
      .catch(function(){return []});
  }
  var jobs=[gq('intitle:'+base+(au?' inauthor:'+au:''))];
  if(pref){jobs.push(gq('intitle:'+base+' inpublisher:'+pref));jobs.push(gq('intitle:'+base+' '+pref))}
  jobs.push(withTimeout(fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(base)+(au?'&author='+encodeURIComponent(au):'')+'&limit=3&fields=key,title,cover_i,isbn'),8000)
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){
      var docs=(j.docs||[]).filter(function(d){return sameTitle(d.title)}).slice(0,2),out=[];
      docs.forEach(function(d){if(d.cover_i)out.push({u:'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg',pub:''});
        (d.isbn||[]).filter(function(x){return /^97[89]4/.test(x)}).slice(0,3).forEach(function(x){out.push({u:ndlThumb(x),pub:''})})});
      return Promise.all(docs.map(function(d){
        return withTimeout(fetch('https://openlibrary.org'+d.key+'/editions.json?limit=200'),9000).then(function(r){if(!r.ok)throw 0;return r.json()})
          .then(function(e){var o=[];(e.entries||[]).forEach(function(ed){var pub=(ed.publishers||[]).join(', ');(ed.covers||[]).slice(0,1).forEach(function(id){if(id>0)o.push({u:'https://covers.openlibrary.org/b/id/'+id+'-M.jpg',pub:pub})})});return o}).catch(function(){return []});
      })).then(function(rs){return out.concat.apply(out,rs)});
    }).catch(function(){return []}));
  return Promise.all(jobs).then(function(rs){
    var all=[].concat.apply([],rs);
    if(pref){var hit=all.filter(function(c){return c.pub.toLowerCase().indexOf(pref)>=0});all=hit.concat(all.filter(function(c){return hit.indexOf(c)<0}))}
    return all;
  });
}
function addCands(list,front){

  var urls=list.map(function(c){return typeof c==='string'?c:c.u});
  draft.cands=uniq(front?urls.concat(draft.cands||[]):(draft.cands||[]).concat(urls)).slice(0,60);
}

function doSearch(){
  var q=$('#f-q').value.trim(),res=$('#results');
  if(!q){res.innerHTML='<p class="note">タイトルや著者名を入れてください。</p>';return}
  res.innerHTML='<p class="note">検索中…</p>';
  var tok=searchTok=Math.random();
  searchBooks(q).then(function(groups){
    if(tok!==searchTok)return;
    lastResults=groups;
    if(!groups.length){res.innerHTML='<p class="note">見つかりませんでした。表記を変えるか、下のフォームから手入力してください。</p>';return}
    groups.forEach(function(g,i){g.loading=i<4});
    renderResults();
    groups.slice(0,4).forEach(function(g){
      moreCovers(g.title,g.author).then(function(more){
        if(tok!==searchTok)return;
        more.forEach(function(c){if(!g._u[c.u]){g._u[c.u]=1;g.covers.push(c)}});
        if(g.covers.length>40)g.covers.length=40;g.loading=false;renderResults();

  }).catch(function(e){res.innerHTML='<p class="note">検索できませんでした。少し待ってからもう一度試すか、手入力で追加してください。<br><small>('+esc(String(e))+')</small></p>'});

var INK='#1b2130',MUTED='#646d82',LINE='#8f98ab',MARK='#ffe04a',ACCENT='#2f43c8';
function wrapText(x,text,maxW){
  var toks=String(text).match(/[　-ヿ㐀-鿿＀-￯]|[^\s　-ヿ㐀-鿿＀-￯]+|\s+/g)||[],lines=[],cur='';
  toks.forEach(function(t){
    if(x.measureText(cur+t).width<=maxW){cur+=t;return}
    if(cur.trim())lines.push(cur.trim());
    cur=/^\s+$/.test(t)?'':t;
    while(cur.length>1&&x.measureText(cur).width>maxW){var i=cur.length;while(i>1&&x.measureText(cur.slice(0,i)).width>maxW)i--;lines.push(cur.slice(0,i));cur=cur.slice(i)}
  });
  if(cur.trim())lines.push(cur.trim());return lines;
}
function clampLines(x,lines,n,maxW){if(lines.length<=n)return lines;var l=lines.slice(0,n),last=l[n-1];while(last.length>1&&x.measureText(last+'…').width>maxW)last=last.slice(0,-1);l[n-1]=last+'…';return l}
function loadImg(src){
  return new Promise(function(res){
    if(!src)return res(null);
    var img=new Image();
    if(!/^data:/.test(src)){img.crossOrigin='anonymous';src=proxied(src)}
    img.onload=function(){res(img)};img.onerror=function(){res(null)};img.src=src;
  });
}
function drawCover(x,b,rx,ry,rw,rh,img){
  x.save();x.beginPath();x.rect(rx,ry,rw,rh);x.clip();
  if(img){var s=Math.max(rw/img.width,rh/img.height),w=img.width*s,h=img.height*s;x.fillStyle='#fff';x.fillRect(rx,ry,rw,rh);x.drawImage(img,rx+(rw-w)/2,ry+(rh-h)/2,w,h)}
  else{
    x.fillStyle='hsl('+hue(b.title)+' 42% 35%)';x.fillRect(rx,ry,rw,rh);
    x.fillStyle='rgba(0,0,0,.18)';x.fillRect(rx,ry,rw*0.05,rh);
    var fs=rw*0.13,pad=rw*0.12,mw=rw-pad-rw*0.08;
    x.fillStyle='#fff';x.textBaseline='top';x.font='700 '+fs+'px "Zen Kaku Gothic New",sans-serif';
    clampLines(x,wrapText(x,b.title,mw),Math.floor((rh*0.72)/(fs*1.25)),mw).forEach(function(t,i){x.fillText(t,rx+pad,ry+rh*0.08+i*fs*1.25)});
    if(b.author){x.font='400 '+(rw*0.09)+'px "Zen Kaku Gothic New",sans-serif';x.globalAlpha=.85;x.textBaseline='bottom';x.fillText(clampLines(x,wrapText(x,b.author,mw),1,mw)[0]||'',rx+pad,ry+rh*0.94);x.globalAlpha=1}
  }
  x.restore();
}

  }).then(function(imgs){

          x.fillStyle=INK;x.fillRect(-tw/2-14,-20,tw+28,48);x.fillStyle=MARK;x.fillRect(-tw/2-14,-22,tw+28,46);

      if(s.kind==='month'){x.fillStyle=INK;x.font='500 31px "DM Mono",monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(s.label,s.lx,s.ly);x.textAlign='left'}
    });
    x.fillStyle=INK;x.textAlign='center';x.font='500 43px "Bricolage Grotesque",sans-serif';x.textBaseline='alphabetic';
    x.fillText('Best book',800,676);x.fillText('of '+year,800,1200);x.textAlign='left';
    x.font='500 66px "Bricolage Grotesque",sans-serif';['Favorite','books of','the year'].forEach(function(t,i){x.fillText(t,28,778+i*71)});

      clampLines(x,wrapText(x,'『'+cb.title+'』',390),3,390).forEach(function(t,i){var y=990+i*48,w=x.measureText(t).width;x.fillStyle=MARK;x.fillRect(28,y+4,w,20);x.fillStyle=INK;x.fillText(t,28,y+18)});
    }else{x.fillStyle=MUTED;x.font='500 26px "Zen Kaku Gothic New",sans-serif';x.fillText('トーナメント進行中',30,990)}
    x.restore();
    var fy=H-FOOT/2-6;x.fillStyle=LINE;x.fillRect(PAD,H-FOOT-6,W-PAD*2,1.5);

    x.fillStyle=MUTED;x.font='500 22px "DM Mono",monospace';x.textAlign='right';x.fillText(siteURL().replace(/^https?:\/\//,'').replace(/\/$/,''),W-PAD,fy);

  });
}

  else if(a==='backup')backup();
  else if(a==='reset'){resetArm=true;render()}
  else if(a==='reset-no'){resetArm=false;render()}
  else if(a==='reset-yes'){resetArm=false;state=blank(year);commit();toast(year+'年をリセットしました')}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='best'&&curM!=null){state.months[curM].best=t.value;commit();renderList()}
  else if(t.id==='f-file'&&t.files&&t.files[0]){draft.token=null;blobToCover(t.files[0]).then(function(u){draft.cover=draft.custom=u;draft.sel='custom';draft.loading=false;$('#addbtn').disabled=false;updatePrev();renderCovers()},function(){toast('この画像は読み込めませんでした')});t.value=''}
  else if(t.id==='f-restore'&&t.files&&t.files[0]){restore(t.files[0]);t.value=''}
  else if(t.id==='yearsel'){year=+t.value;state=loadYear(year);lsSet('fbty-year',String(year));resetArm=false;render()}
});
document.addEventListener('input',function(e){if(e.target.id==='f-title'||e.target.id==='f-author'){updatePrev();var at=document.querySelector('.ctile[data-u="auto"]');if(at)renderCovers()}});
document.addEventListener('submit',function(e){
  if(e.target.id==='searchform'){e.preventDefault();doSearch();return}
  if(e.target.id!=='addform')return;e.preventDefault();
  if(draft.loading)return;
  var ti=$('#f-title').value.trim();if(!ti){$('#f-title').focus();return}
  var au=$('#f-author').value.trim(),m=curM;
  if(draft.editId){var bk=state.months[m].books.filter(function(b){return b.id===draft.editId})[0];if(bk){bk.title=ti;bk.author=au;bk.cover=draft.cover||''}
    resetForm();commit();renderList();toast('表紙を変更しました');$('#list').scrollIntoView({behavior:'smooth',block:'start'});return}
  state.months[m].books.push({id:uid(),title:ti,author:au,cover:draft.cover||''});
  resetForm();$('#results').innerHTML='';$('#f-q').value='';commit();renderList();
  toast((m+1)+'月に追加しました');
});
document.addEventListener('paste',function(e){
  if(curM==null)return;var f=e.clipboardData&&e.clipboardData.files&&e.clipboardData.files[0];
  if(f&&/^image\//.test(f.type)){e.preventDefault();blobToCover(f).then(function(u){draft.cover=draft.custom=u;draft.sel='custom';updatePrev();renderCovers()},function(){})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#scrim'))closeSheet();if(e.key==='Enter'&&e.target.id==='f-kw'){e.preventDefault();var b=document.querySelector('[data-act=coversearch]');if(b)b.click()}});

render();
})();
</script>
</body>
</html>
